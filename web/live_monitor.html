<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Live Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #101418;
  --muted: #6b7280;
  --line: #e4e6ea;
  --red: #dc2626;
  --green: #16a34a;
  --blue: #1d4ed8;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x:hidden; }
body {
  font-family: 'Noto Sans Thai', sans-serif;
  background: var(--bg);
  background-image: radial-gradient(#d8dbe1 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  min-height: 100vh;
}
.num { font-family: 'Space Grotesk','Noto Sans Thai',sans-serif; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 18px 20px 28px; }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.brand { display:flex; align-items:center; gap:12px; }
.brand .pulse {
  width: 14px; height: 14px; border-radius: 50%; background: var(--red);
  box-shadow: 0 0 0 0 rgba(220,38,38,.5); animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(220,38,38,.45); }
  70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}
.brand h1 {
  font-family: 'Space Grotesk','Noto Sans Thai',sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: -.5px;
}
.brand h1 span { color: var(--red); }
.topmeta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.livenow {
  display:inline-flex; align-items:center; gap:6px;
  background: #fef2f2; border:1px solid #fecaca; color: var(--red);
  font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
}
.livenow .d { width:7px; height:7px; border-radius:50%; background:var(--red); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity:.25; } }
select#dateSel {
  font-family: 'Space Grotesk','Noto Sans Thai',sans-serif;
  font-size: 13px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  max-width: 150px;
}
select#dateSel:hover { border-color: #b9bec7; }
/* ── Date nav (prev/next + select) ── */
.datenav { display:inline-flex; align-items:center; gap:4px; }
.datenav button {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer;
  display:inline-flex; align-items:center; justify-content:center;
}
.datenav button:hover:not(:disabled) { border-color:#b9bec7; }
.datenav button:disabled { opacity:.35; cursor:default; }
.updated { font-size: 12px; color: var(--muted); }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; align-items:center; border-bottom: 2px solid var(--line); margin-bottom: 16px; flex-wrap:wrap; }
.tabs button {
  font-family: 'Noto Sans Thai',sans-serif; font-size: 13.5px; font-weight: 500;
  background: none; border: none; padding: 8px 14px; cursor: pointer;
  color: var(--muted); position: relative; transition: color .15s;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); font-weight: 600; }
.tabs button.active::after {
  content:''; position:absolute; left:8px; right:8px; bottom:-2px; height:3px;
  background: var(--red); border-radius: 2px 2px 0 0;
}
.tabs button .cnt {
  font-family:'Space Grotesk',sans-serif; font-size:11px; background:#eef0f3;
  color:var(--muted); border-radius:10px; padding:1px 7px; margin-left:6px;
}
.tabs button.active .cnt { background:#fef2f2; color:var(--red); }
.tabs select {
  font-family: 'Noto Sans Thai',sans-serif; font-size: 13.5px; font-weight: 500;
  padding: 7px 10px; margin: 2px 0 8px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--ink); cursor: pointer;
}

/* ── Stat strip ── */
.strip { display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.stat {
  background: var(--card); border:1px solid var(--line); border-radius:10px;
  padding: 12px 14px; transition: transform .15s, box-shadow .15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(16,20,24,.07); }
.stat .lbl { font-size:11px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.stat .val { font-family:'Space Grotesk','Noto Sans Thai',sans-serif; font-size:24px; font-weight:700; letter-spacing:-1px; line-height:1; }
.stat .sub { font-size:12px; color:var(--muted); margin-top:4px; }
.stat.red .val { color: var(--red); }
.stat.blue .val { color: var(--blue); }

/* ── Cards / charts ── */
.panel {
  background: var(--card); border:1px solid var(--line); border-radius:12px;
  padding: 16px; margin-bottom: 16px;
}
.panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.panel-head h2 { font-size:16px; font-weight:600; display:flex; align-items:center; gap:10px; }
.panel-head .hint { font-size:12px; color:var(--muted); }
.chip { font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; }
.chip.live { background:#dcfce7; color:var(--green); }
.chip.off { background:#f1f2f4; color:var(--muted); }
.chartbox { position:relative; height:280px; }
.chartbox.tall { height:340px; }
.chartbox.fullpage { height: 280px; min-height: 220px; }
.compare-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 18px; }
.compare-toolbar .range-label { font-size:13px; color:var(--muted); }
.range-buttons { display:flex; gap:6px; }
.range-buttons button { font-family:'Noto Sans Thai',sans-serif; font-size:12px; border:1px solid var(--line); background:#fff; color:var(--muted); padding:6px 11px; border-radius:7px; cursor:pointer; }
.range-buttons button:hover { border-color:#aeb5c0; color:var(--ink); }
.range-buttons button.active { background:var(--ink); border-color:var(--ink); color:#fff; }
.compare-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:18px; }
.compare-summary .stat { padding:12px 14px; }
.compare-summary .stat .val { font-size:22px; }
.compare-summary .stat .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.compare-table th.program-head { white-space:normal; min-width:140px; }
.compare-table th.program-head small { display:block; margin-top:3px; font-size:10px; font-weight:400; color:var(--muted); text-transform:none; letter-spacing:0; }
.compare-table td { min-width:120px; }
.compare-panels { display:grid; gap:18px; }
@media (max-width: 720px) {
  .compare-toolbar { align-items:flex-start; }
  .compare-toolbar .range-label { flex:1 1 100%; line-height:1.45; }
  .range-buttons { width:100%; }
  .range-buttons button { flex:1; }
  .compare-summary { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
  .compare-summary .stat .sub { white-space:normal; word-break:break-word; }
  .compare-summary .stat .val { font-size:18px; }
  .panel { padding:14px; }
  .panel-head .hint { width:100%; font-size:11px; line-height:1.5; }
  .chartbox.fullpage { height:250px; min-height:0; }
  .compare-table td { min-width:0; }
  .compare-table td::before { content:attr(data-label); text-transform:none; font-size:11px; }
  .compare-table td.date-cell { display:block; padding-bottom:9px; color:var(--ink); }
  .compare-table td.date-cell::before { display:none; }
  .compare-table td[data-label]:not(.date-cell) { align-items:center; }
  .compare-table .peakcell { font-size:16px; }
  .compare-table .delta { margin-left:auto !important; }
  .compare-table .airtime { margin-left:auto; }
}
.chartbox.mini { height:130px; }
body.chview .wrap { max-width: 100%; padding-left: 28px; padding-right: 28px; }

/* ── Channel cards grid (overview) ── */
.chgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-bottom:16px; }
.chcard {
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
  cursor:pointer; transition: transform .15s, box-shadow .15s, border-color .15s;
  border-top: 3px solid var(--chcolor,#999);
}
.chcard:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(16,20,24,.09); }
.chcard .name { font-size:14px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:8px; }
.chcard .peak { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; letter-spacing:-1px; margin:6px 0 1px; color:var(--chcolor); }
.chcard .peaklbl { font-size:10px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
.chcard .row { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-top:1px solid #f0f1f3; margin-top:6px; }
.chcard .row .k { color:var(--muted); }
.chcard .row .v { font-weight:600; }
.chcard .go { font-size:11px; color:var(--blue); font-weight:600; margin-top:6px; }

/* ── Channel compact menu (homepage) ── */
.chmenu { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:8px; margin-bottom:16px; }
.chmenu-item {
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-left:4px solid var(--chcolor);
  border-radius:9px; padding:9px 12px; cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.chmenu-item:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(16,20,24,.08); }
.chmenu-item .cn { font-size:13.5px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chmenu-item .cpk { font-family:'Space Grotesk','Noto Sans Thai',sans-serif; font-size:15px; font-weight:700; color:var(--chcolor); }
.chmenu-item .go { color:var(--blue); font-size:13px; }
@media (max-width:720px){ .chmenu { grid-template-columns:1fr; } }

/* ── Table ── */
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:11px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); padding:8px 12px; border-bottom:2px solid var(--line); white-space:nowrap; }
td { padding:8px 12px; font-size:13px; border-bottom:1px solid #f0f1f3; vertical-align:middle; }
tbody tr { transition: background .12s; }
tbody tr:hover { background:#fafbfc; }
td.t-title { max-width:420px; }
a.tlink { color:var(--ink); text-decoration:none; font-weight:500; }
a.tlink:hover { color:var(--blue); text-decoration:underline; }
.badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; letter-spacing:.3px; }
.badge.live { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
.badge.ended { background:#f1f2f4; color:var(--muted); }
td.peakcell { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }

/* ── Mobile ── */
@media (max-width: 720px) {
  .wrap { padding: 14px 12px 40px; }
  .brand h1 { font-size: 20px; }
  .topbar { gap: 10px; }
  .strip { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .stat { padding: 10px 12px; }
  .stat .val { font-size: 20px; }
  .chartbox { height: 220px; }
  .chartbox.fullpage { height: 40vh; min-height: 220px; }
  .chartbox.mini { height: 120px; }
  .minigrid { grid-template-columns: 1fr; }
  .tabs button { font-size: 13px; padding: 8px 10px; }
  .tabs select { max-width: 100%; }
  .sechead { font-size: 16px; margin: 22px 0 10px; }

  /* Table → card list */
  .tablepanel { padding: 0; overflow: hidden; }
  .tablepanel table, .tablepanel tbody, .tablepanel tr, .tablepanel td { display: block; width: 100%; }
  .tablepanel thead { display: none; }
  .tablepanel tr {
    padding: 14px 16px; border-bottom: 1px solid #f0f1f3;
  }
  .tablepanel tr:hover { background: #fafbfc; }
  .tablepanel td {
    border: none; padding: 3px 0; font-size: 13px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .tablepanel td::before {
    content: attr(data-label);
    font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted); flex-shrink: 0;
  }
  .tablepanel td.t-title { display: block; padding-bottom: 8px; }
  .tablepanel td.t-title::before { display: none; }
  .tablepanel td.t-title a { font-size: 14px; line-height: 1.5; }
  .tablepanel td.peakcell { font-size: 16px; }
}

/* ── Per-stream mini chart grid ── */
.minigrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
.minicard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; transition: box-shadow .15s, transform .15s; }
.minicard:hover { box-shadow:0 8px 20px rgba(16,20,24,.08); transform:translateY(-2px); }
.minicard .mtitle { font-size:13px; font-weight:600; line-height:1.45; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.minicard .mmeta { font-size:11.5px; color:var(--muted); margin-bottom:10px; }
.minicard .mmeta b { color:var(--ink); font-family:'Space Grotesk',sans-serif; }

.sechead { font-size:16px; font-weight:700; margin:18px 0 10px; display:flex; align-items:center; gap:10px; }
.sechead::before { content:''; width:5px; height:20px; background:var(--red); border-radius:3px; }
.backlink { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; margin-bottom:16px; }
.backlink:hover { text-decoration:underline; }
.morebtn {
  display:block; width:100%; margin-top:8px; padding:8px; font-family:'Noto Sans Thai',sans-serif;
  font-size:12.5px; font-weight:600; color:var(--muted); background:#fafbfc;
  border:1px dashed var(--line); border-radius:8px; cursor:pointer;
}
.morebtn:hover { color:var(--ink); border-color:#b9bec7; }
.empty { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
.footer { text-align:center; font-size:11.5px; color:#9aa0aa; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="pulse"></span>
      <h1>YT LIVE <span>MONITOR</span></h1>
    </div>
    <div class="topmeta">
      <span class="livenow" id="liveBadge"><span class="d"></span><span id="liveCount">-</span> LIVE</span>
      <span class="datenav">
        <button id="datePrev" onclick="shiftDate(1)" title="วันก่อนหน้า">‹</button>
        <select id="dateSel" onchange="onDateChange()"><option value="">กำลังโหลด...</option></select>
        <button id="dateNext" onclick="shiftDate(-1)" title="วันถัดไป">›</button>
      </span>
      <span class="updated num" id="updated"></span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="empty">กำลังโหลดข้อมูล...</div></div>
  <div class="footer">ข้อมูลจาก YouTube Data API · สำรวจทุก 5 นาที · เวลาไทย (ICT)</div>
</div>

<script>
const CH_COLORS = {
  'ThaiRath News':    '#16a34a',   // ไทยรัฐ เขียว
  'ThaiRath Variety': '#65a30d',   // ไทยรัฐ เขียวอ่อน (แยกให้ต่างจาก News)
  'ข่าวช่อง8':        '#dc2626',   // แดง
  'ช่อง8 Thai Ch8':   '#ef4444',   // แดงอ่อน
  'Amarin TV':        '#0ea5e9',   // น้ำเงินอมฟ้า
  'เรื่องเล่าเช้านี้': '#f59e0b',   // ส้ม (ช่อง 3)
  'ครอบครัวข่าว3':    '#e11d48',   // แดงเข้ม (ช่อง 3)
  'ข่าวเวิร์คพอยท์ 23': '#8b5cf6',  // ม่วง
  'Ch7HDNews':        '#0d9488',   // เขียวอมฟ้า
  'Ch7HD':            '#0f766e',
  'TOP NEWS LIVE':    '#0f766e',   // ใช้สีเดียวกับ Ch7HD เดิม
  'Thai PBS':         '#475569',   // เทาเข้ม
  'terodigital':      '#d97706',   // เหลืองเข้ม
  'Dailynews Online': '#2563eb',   // น้ำเงิน
  'สรยุทธ กรรมกรข่าว': '#7c3aed',   // ม่วง (สรยุทธ)
};
function chColor(ch){ 
  return CH_COLORS[ch] || '#64748b'; 
}
function progLabel(p){ 
  return p.name;
}
let DATA = null;
let SLOTCMP = null;        // /api/slot-compare data (compare view)
let VIEW = 'overview';      // 'overview' | 'compare' | channel name
let DATE = null;            // null = ยังไม่เลือก (ใช้วันที่ล่าสุด), '' = ทั้งหมด, 'YYYY-MM-DD' = วันนั้น
let charts = [];
let COMPARE_RANGE = 7;      // จำนวนวันที่แสดงในหน้าเปรียบเทียบ; 0 = ทั้งหมด
let COMPARE_SLOT = 0;       // slot ที่เลือกในหน้าเปรียบเทียบ (index ใน SLOTS)
let COMPARE_DAY = '';       // วันที่เลือกดูกราฟรายวัน ('' = ไม่เลือก)
let RANK_FULL = false;      // ตาราง Program Ranking: แสดง 10 อันดับแรกก่อน
let MINI_FULL = false;      // กราฟแยกรายการ: แสดง 6 อันแรกก่อน

function fmt(n){ return (n||0).toLocaleString('th-TH'); }
function toICT(ts){
  if(!ts) return null;
  if(ts.endsWith('Z')) return new Date(ts).getTime();
  // Normalize "YYYY-MM-DD H:M:S" (อาจไม่ zero-pad จาก Sheets backfill)
  const m = ts.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  if(m){
    const [,y,mo,d,h,mi,s] = m;
    return new Date(`${y}-${mo}-${d}T${h.padStart(2,'0')}:${mi.padStart(2,'0')}:${s.padStart(2,'0')}+07:00`).getTime();
  }
  return new Date(ts.replace(' ','T')+'+07:00').getTime();
}
function fmtTime(ms){
  return new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
}
function fmtDayTime(ms){
  const d=new Date(ms);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'})+' '+fmtTime(ms);
}
function fmtStart(iso){
  const ms = toICT(iso);
  return ms ? fmtDayTime(ms) : '-';
}
function fmtTs(ts){ const ms=toICT(ts); return ms?fmtDayTime(ms):'-'; }
function fmtTsTime(ts){ const ms=toICT(ts); return ms?fmtTime(ms):'-'; }
function shortTitle(t,n=48){ return t.length>n ? t.slice(0,n)+'…' : t; }

function destroyCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }

/* ── Navigation ── */
function renderTabs(){
  const el = document.getElementById('tabs');
  const chs = Object.keys(DATA.channels).sort((a,b)=>a.localeCompare(b,'th'));
  const isCh = VIEW!=='overview' && VIEW!=='compare' && !!DATA.channels[VIEW];
  let h = `<button class="${VIEW==='overview'?'active':''}" onclick="go('overview')">ภาพรวม</button>`;
  h += `<button class="${VIEW==='compare'?'active':''}" onclick="go('compare')">เปรียบเทียบรายการข่าว</button>`;
  if(chs.length){
    h += `<select onchange="if(this.value)go(this.value)">`;
    h += `<option value="" ${isCh?'':'selected'} disabled>ช่อง…</option>`;
    for(const ch of chs){
      const n = DATA.channels[ch].streams.length;
      h += `<option value="${ch}" ${VIEW===ch?'selected':''}>${ch} (${n})</option>`;
    }
    h += `</select>`;
    if(isCh) h += `<button class="active">${VIEW}</button>`;
  }
  el.innerHTML = h;
}
function go(view){
  const switching = (view==='compare') !== (VIEW==='compare');
  VIEW=view;
  RANK_FULL=false; MINI_FULL=false; COMPARE_DAY='';
  if(switching) load(); else render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function onDateChange(){ DATE = document.getElementById('dateSel').value || ''; load(); }
function shiftDate(dir){  // dir=1 ย้อนหลัง, -1 เดินหน้า
  const sel = document.getElementById('dateSel');
  const dates = [...sel.options].map(o=>o.value).filter(Boolean);  // เรียงใหม่→เก่าจาก API
  dates.sort().reverse();
  if(!DATE){ // "ทั้งหมด" อยู่ → กดย้อน = วันล่าสุด
    DATE = dates[0] || ''; load(); return;
  }
  const i = dates.indexOf(DATE);
  if(i < 0){ DATE = dates[0] || ''; load(); return; }
  const ni = i + dir;
  if(ni < 0 || ni >= dates.length) return;
  DATE = dates[ni]; load();
}

/* ── Overview ── */
// เรียงการ์ดช่อง: 1) กำลัง LIVE ขึ้นก่อน 2) เรียงตาม peak viewers สูง→ต่ำ
function channelSortScore(ch){
  const info = DATA.channels[ch];
  const live = info.streams.some(s=>s.is_live) ? 1 : 0;
  return [live, info.peak];
}
function renderOverview(){
  const chs = Object.keys(DATA.channels).sort((a,b)=>{
    const [la,pa] = channelSortScore(a), [lb,pb] = channelSortScore(b);
    return (lb-la) || (pb-pa);
  });
  const allStreams = chs.flatMap(ch=>DATA.channels[ch].streams.map(s=>({...s, ch})));
  const liveStreams = allStreams.filter(s=>s.is_live);
  // Σ concurrent viewers ตอนนี้ (ผลรวม last sample ของทุกรายการที่กำลัง live)
  const totalNow = liveStreams.reduce((sum,s)=>sum+(s.points[s.points.length-1].viewers||0),0);
  let topStream = null, topCh = '';
  for(const ch of chs) for(const s of DATA.channels[ch].streams){
    if(!topStream || s.peak > topStream.peak){ topStream = s; topCh = ch; }
  }
  const dateLbl = DATE || 'ทั้งหมด';

  // 1) Hero: Σ concurrent ตอนนี้ + Peak วันนี้
  let h = `<div class="strip">
    <div class="stat red"><div class="lbl">Concurrent ตอนนี้ (รวมทุกช่อง)</div><div class="val num">${fmt(totalNow)}</div><div class="sub">${liveStreams.length} รายการ LIVE · รวม ${new Set(liveStreams.map(s=>s.ch)).size} ช่อง</div></div>
    <div class="stat blue"><div class="lbl">Peak วันนี้ · ${dateLbl}</div><div class="val num">${topStream?fmt(topStream.peak):'-'}</div><div class="sub">${topStream?shortTitle(topStream.title,42)+' · '+topCh:'-'}</div></div>
  </div>`;

  // 2) Concurrent ตอนนี้ — รายการ live (ชื่อรายการ + ช่อง + ผู้ชมตอนนี้ + peak)
  const liveSorted = [...liveStreams].sort((a,b)=>(b.points[b.points.length-1].viewers||0)-(a.points[a.points.length-1].viewers||0));
  h += `<div class="sechead">Concurrent ตอนนี้</div>
  <div class="panel tablepanel">
  <table><thead><tr>
    <th>รายการ (Live)</th><th>ช่อง</th><th>ผู้ชมตอนนี้</th><th>Peak</th>
  </tr></thead><tbody>`;
  if(!liveSorted.length){
    h += `<tr><td colspan="4"><div class="empty" style="padding:20px 0">ไม่มีรายการ live ในขณะนี้</div></td></tr>`;
  }
  liveSorted.forEach(s=>{
    const cur = s.points[s.points.length-1].viewers||0;
    h += `<tr>
      <td class="t-title" data-label="รายการ (Live)"><a class="tlink" href="${s.url}" target="_blank">${s.title}</a></td>
      <td data-label="ช่อง"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${chColor(s.ch)};display:inline-block;"></span>${s.ch}</span></td>
      <td class="peakcell" data-label="ผู้ชมตอนนี้" style="color:var(--red)">${fmt(cur)}</td>
      <td class="peakcell" data-label="Peak" style="color:${chColor(s.ch)}">${fmt(s.peak)}</td>
    </tr>`;
  });
  h += `</tbody></table></div>`;

  // 3) Concurrent รวมทุกช่อง (กราฟเวลา)
  h += `<div class="panel">
    <div class="panel-head"><h2>Concurrent Viewers รวมทุกช่อง</h2><span class="hint">ข้อมูลวันที่ ${DATE||'ทั้งหมด'} · hover ดูค่า</span></div>
    <div class="chartbox fullpage"><canvas id="comboChart"></canvas></div>
  </div>`;

  // 4) ช่อง — compact menu
  h += `<div class="sechead">ช่อง</div><div class="chmenu">`;
  for(const ch of chs){
    const info = DATA.channels[ch];
    const liveN = info.streams.filter(s=>s.is_live).length;
    h += `<div class="chmenu-item" style="--chcolor:${chColor(ch)}" onclick="go('${ch.replace(/'/g,"\\'")}')">
      <span class="cn">${ch}</span>
      ${liveN?`<span class="chip live num">${liveN} LIVE</span>`:`<span class="chip off">OFF AIR</span>`}
      <span class="cpk num">${fmt(info.peak)}</span>
      <span class="go">→</span>
    </div>`;
  }
  h += `</div>`;

  document.getElementById('content').innerHTML = h;
  drawComboChart(chs);
}

function drawComboChart(chs){
  // ts → {ch: sum}
  const byTs = {};
  for(const ch of chs){
    for(const s of DATA.channels[ch].streams){
      for(const p of s.points){
        if(!byTs[p.ts]) byTs[p.ts]={};
        byTs[p.ts][ch]=(byTs[p.ts][ch]||0)+p.viewers;
      }
    }
  }
  const tsAll = Object.keys(byTs).sort((a,b)=>toICT(a)-toICT(b));
  const labels = tsAll.map(ts=>toICT(ts));
  const datasets = chs.map(ch=>({
    label: ch,
    data: tsAll.map(ts=>({x:toICT(ts), y:byTs[ts][ch]||0})),
    borderColor: chColor(ch),
    backgroundColor: chColor(ch)+'18',
    borderWidth: 2, pointRadius: 0, tension:.3, fill:true,
  }));
  charts.push(new Chart(document.getElementById('comboChart'),{
    type:'line',
    data:{datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      parsing:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',font:{family:'Noto Sans Thai',size:12}}},
        tooltip:{callbacks:{
          title:items=>fmtDayTime(items[0].parsed.x),
          label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`}} },
      scales:{
        x:{type:'linear',bounds:'data',ticks:{maxTicksLimit:14,callback(v){return DATE?fmtTime(v):fmtDayTime(v);}}},
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}
      }
    }
  }));
}

/* ── Slot comparison (เช้า/เที่ยง/เย็น/Primetime วันต่อวัน) ── */
function slotDateLabel(d){
  const dt = new Date(d+'T00:00:00+07:00');
  return dt.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Bangkok'});
}
function diffHtml(cur, prev){
  if(prev==null || prev===0 || cur==null) return '<span style="color:var(--muted)">-</span>';
  const pct = (cur-prev)/prev*100;
  const cls = pct>=0 ? 'color:var(--green)' : 'color:var(--red)';
  return `<span style="${cls};font-weight:600">${pct>=0?'+':''}${pct.toFixed(0)}%</span>`;
}
function setCompareRange(range){
  COMPARE_RANGE = range;
  render();
}
function setCompareSlot(i){
  COMPARE_SLOT = i;
  COMPARE_DAY = '';
  render();
}
function setCompareDay(day){
  COMPARE_DAY = day || '';
  render();
}
async function renderCompare(){
  if(!SLOTCMP){
    try{
      const r = await fetch('/api/slot-compare', {cache:'no-store'});
      SLOTCMP = await r.json();
    }catch(e){
      document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--red)">โหลดข้อมูลเปรียบเทียบไม่สำเร็จ</div>';
      return;
    }
  }
  const slots = SLOTCMP.slots||[];
  let h = `<div class="sechead" style="margin-top:0">เปรียบเทียบ Live รายการข่าว</div>
    <div class="compare-toolbar">
      <span class="range-label">เลือกช่วงเวลาที่ต้องการดู (การ์ดด้านล่าง) · Peak viewers รายวัน</span>
      <div class="range-buttons">
        <button class="${COMPARE_RANGE===7?'active':''}" onclick="setCompareRange(7)">7 วัน</button>
        <button class="${COMPARE_RANGE===14?'active':''}" onclick="setCompareRange(14)">14 วัน</button>
        <button class="${COMPARE_RANGE===30?'active':''}" onclick="setCompareRange(30)">30 วัน</button>
        <button class="${COMPARE_RANGE===0?'active':''}" onclick="setCompareRange(0)">ทั้งหมด</button>
      </div>
    </div>`;
  if(!slots.length){
    h += '<div class="empty">ยังไม่มีข้อมูล</div>';
    document.getElementById('content').innerHTML = h;
    return;
  }

  // การ์ดสรุป = tab เลือกช่วงเวลา: แสดงผู้ชนะล่าสุดของแต่ละ slot, คลิกเพื่อเปิดรายละเอียด
  if(COMPARE_SLOT >= slots.length) COMPARE_SLOT = 0;
  h += `<div class="compare-summary">`;
  slots.forEach((slot,si)=>{
    const allDates = new Set();
    slot.programs.forEach(p=>Object.keys(p.days).forEach(d=>allDates.add(d)));
    const latest = [...allDates].sort().reverse()[0];
    const rows = latest ? slot.programs.map(p=>({name:progLabel(p), peak:p.days[latest]?.peak||0})).filter(x=>x.peak>0).sort((a,b)=>b.peak-a.peak) : [];
    const winner = rows[0];
    const active = si===COMPARE_SLOT;
    h += `<div class="stat blue${active?' slot-active':''}" style="cursor:pointer;${active?'border-color:var(--red);box-shadow:0 4px 14px rgba(220,38,38,.12);':''}" onclick="setCompareSlot(${si})">
      <div class="lbl">${slot.name} · ล่าสุด${active?' <span style="color:var(--red)">●</span>':''}</div>
      <div class="val num">${winner?fmt(winner.peak):'-'}</div>
      <div class="sub">${winner?winner.name:'ยังไม่มีข้อมูล'}${latest?' · '+slotDateLabel(latest):''}</div>
    </div>`;
  });
  h += `</div>`;

  // แสดงรายละเอียดเฉพาะ slot ที่เลือก (กราฟ + ตาราง) — ไม่ต้อง scroll ผ่าน 5 ช่วง
  const slot = slots[COMPARE_SLOT];
  const si = COMPARE_SLOT;
  const allDates = new Set();
  slot.programs.forEach(p=>Object.keys(p.days).forEach(d=>allDates.add(d)));
  const descDates = [...allDates].sort().reverse();
  const dates = COMPARE_RANGE ? descDates.slice(0,COMPARE_RANGE) : descDates;
  const chartDates = [...dates].sort();

  // ── เลือกวัน → กราฟ concurrent รายวัน (ใครขึ้นตรงไหน) ──
  const dayOptions = descDates;
  if(!COMPARE_DAY || !dayOptions.includes(COMPARE_DAY)) COMPARE_DAY = dayOptions[0] || '';
  h += `<div class="compare-toolbar" style="margin-top:2px">
    <span class="range-label">เลือกวัน เพื่อดูกราฟ concurrent รายวันของแต่ละรายการ (ใครขึ้นตรงไหน)</span>
    <select id="compareDay" onchange="setCompareDay(this.value)" style="font-family:'Noto Sans Thai',sans-serif;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer">
      <option value="">-- เลือกวัน --</option>
      ${dayOptions.map(d=>`<option value="${d}" ${d===COMPARE_DAY?'selected':''}>${slotDateLabel(d)}</option>`).join('')}
    </select>
  </div>`;

  if(COMPARE_DAY){
    h += `<div class="panel">
      <div class="panel-head"><h2>Concurrent รายวัน — ${slot.name} · ${slotDateLabel(COMPARE_DAY)}</h2><span class="hint">เส้นของแต่ละรายการในวันนั้น · hover ดูค่า</span></div>
      <div class="chartbox fullpage"><canvas id="dayCompareChart"></canvas></div>
    </div>`;
  }

  // กราฟขึ้นก่อน แล้วตามด้วยตารางรายละเอียด
  h += `<div class="panel">
    <div class="panel-head"><h2>แนวโน้ม Peak — ${slot.name}</h2></div>
    <div class="chartbox fullpage"><canvas id="slotChart${si}"></canvas></div>
  </div>`;

  h += `<div class="panel">
    <div class="panel-head"><h2>${slot.name}</h2><span class="hint">Peak viewers · Δ% เทียบวันก่อนหน้า · เวลาออกอากาศ</span></div>
    <div class="tablepanel compare-table" style="overflow-x:auto">
    <table><thead><tr><th>วันที่</th>`;
  slot.programs.forEach(p=>{
    h += `<th class="program-head" style="text-align:right"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${chColor(p.channel)};display:inline-block"></span>${p.name}</span></th>`;
  });
  h += `</tr></thead><tbody>`;
  dates.forEach(date=>{
    h += `<tr><td class="num date-cell" data-label="วันที่" style="white-space:nowrap;font-weight:600">${slotDateLabel(date)}</td>`;
    slot.programs.forEach(p=>{
      const e = p.days[date];
      const prev = p.days[prevDateOf(descDates,date)];
      if(!e){
        h += `<td class="num" data-label="${p.name}" style="text-align:right;color:var(--muted)">—</td>`;
      }else{
        h += `<td class="num" data-label="${p.name}" style="text-align:right">
          <span class="peakcell">${fmt(e.peak)}</span>
          <span class="delta" style="font-size:11.5px;margin-left:6px">${diffHtml(e.peak, prev?prev.peak:null)}</span>
          <div class="airtime" style="font-size:11px;color:var(--muted)">${e.start}–${e.end}</div>
        </td>`;
      }
    });
    h += `</tr>`;
  });
  h += `</tbody></table></div></div>`;

  document.getElementById('content').innerHTML = h;

  charts.push(new Chart(document.getElementById('slotChart'+si),{
    type:'line',
    data:{labels:chartDates.map(slotDateLabel),datasets:slot.programs.map(p=>({
      label:progLabel(p),
      data:chartDates.map(d=>p.days[d]?p.days[d].peak:null),
      borderColor:chColor(p.channel), backgroundColor:chColor(p.channel),
      borderWidth:2.5, tension:.3, spanGaps:true, pointRadius:3, pointHoverRadius:5
    }))},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',font:{family:'Noto Sans Thai',size:12}}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`}}},
      scales:{x:{ticks:{maxTicksLimit:7}},y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}}
    }
  }));

  if(COMPARE_DAY) renderDayCompare(slot, si);
}
function prevDateOf(sortedDescDates, date){
  const i = sortedDescDates.indexOf(date);
  return sortedDescDates[i+1];  // sortedDescDates เรียงล่าสุดก่อน → index+1 = วันก่อนหน้า
}

/* ── กราฟรายวัน: concurrent curve ของแต่ละรายการใน slot ณ วันที่เลือก ── */
async function renderDayCompare(slot, si){
  const canvas = document.getElementById('dayCompareChart');
  if(!canvas) return;
  let dayData;
  try{
    const r = await fetch('/api/live-data?date='+COMPARE_DAY);
    dayData = await r.json();
  }catch(e){
    return;
  }
  const datasets = [];
  slot.programs.forEach(prog=>{
    const matches = [];
    for(const [ch, info] of Object.entries(dayData.channels||{})){
      if(ch !== prog.channel) continue;
      for(const s of (info.streams||[])){
        if(prog.vids && prog.vids.length){
          if(prog.vids.includes(s.video_id)) matches.push(s);
        }else if(prog.kw && prog.kw.length){
          if(prog.kw.some(k=>s.title.includes(k))) matches.push(s);
        }
      }
    }
    matches.forEach((s,i)=>{
      datasets.push({
        label: matches.length>1 ? `${prog.live_title||prog.name} (${i+1})` : (prog.live_title||prog.name),
        data: s.points.map(p=>({x:toICT(p.ts), y:p.viewers})),
        borderColor: chColor(prog.channel),
        backgroundColor: chColor(prog.channel)+'14',
        borderWidth: 2, pointRadius: 0, tension: .3, fill: false,
      });
    });
  });
  if(!datasets.length){
    canvas.parentElement.innerHTML = '<div class="empty">ไม่มีข้อมูลรายการในวันนี้</div>';
    return;
  }
  charts.push(new Chart(canvas,{
    type:'line',
    data:{datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      parsing:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',font:{family:'Noto Sans Thai',size:12}}},
        tooltip:{callbacks:{title:items=>fmtDayTime(items[0].parsed.x), label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`}}},
      scales:{
        x:{type:'linear',bounds:'data',ticks:{maxTicksLimit:14,callback:v=>fmtTime(v)}},
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}
      }
    }
  }));
}

/* ── Render / load ── */
function render(){
  destroyCharts();
  renderTabs();
  document.body.classList.toggle('chview', VIEW!=='overview' && !!(DATA&&DATA.channels[VIEW]));
  if(!DATA || !Object.keys(DATA.channels).length){
    document.getElementById('content').innerHTML = '<div class="empty">ยังไม่มีข้อมูลในวันที่เลือก</div>';
    return;
  }
  if(VIEW==='overview') renderOverview();
  else if(VIEW==='compare') renderCompare();
  else if(DATA.channels[VIEW]) renderChannel(VIEW);
  else renderOverview();
}

async function load(){
  try{
    if(DATE === null){
      // Optimization v2 (2026-08-31 #2): ใช้ ?recent_days=7 เป็นหลัก
      // เดิมมาแรกใช้ d0เพื่อเก็บ d0.datesแล้วค่อย fetch ?date=DATE อีกครั้ง (=2 fetch)
      // ตอนนี้ใช้ ?recent_days=7 =มีข้อมูล 7 วันพร้อม streams →ไม่ต้อง fetchวันเดิมซ้ำ
      // แค่ filter client-side เป็นวันล่มาสุด
      const r0 = await fetch('/api/live-data?recent_days=7');
      const d0 = await r0.json();
      DATE = (d0.dates||[])[0] || '';
      // ใช้ d0เป็น DATA ตรง (มีข้อมูล 7 วัน) → render ได้เลย ไม่ต้อง fetchอีก
      DATA = d0;
    } else if (!DATA) {
      // หาก DATE มีค่าแต่ DATA ไม่มี (เช่นเปลี่ยนวันจากอื่น) → fetchวันนั้น
      const url = '/api/live-data?date='+DATE;
      const r = await fetch(url);
      DATA = await r.json();
    }
    if(VIEW==='compare') SLOTCMP = null;
    // NOTE: url มาก่อนใช้สำหรับ fetchอีกครั้งถ้าจำเป็น — ปัจจุบันไม่ใช้เลยเพราะ
    // DATAถูกตั้งให้แล้ว (d0หรือ fetchแยก)
    const sel = document.getElementById('dateSel');
    const dates14 = (DATA.dates||[]).slice(0,14);
    sel.innerHTML = '<option value="">ทั้งหมด</option>' +
      dates14.map(d=>`<option value="${d}" ${d===DATE?'selected':''}>${d}</option>`).join('') +
      (DATE && !dates14.includes(DATE) ? `<option value="${DATE}" selected>${DATE}</option>` : '');
    const allDates = (DATA.dates||[]);
    document.getElementById('datePrev').disabled = !allDates.length || DATE === allDates[allDates.length-1];
    document.getElementById('dateNext').disabled = !allDates.length || !DATE || DATE === allDates[0];

    // live badge + updated
    const liveN = Object.values(DATA.channels).reduce((s,c)=>s+c.streams.filter(x=>x.is_live).length,0);
    document.getElementById('liveCount').textContent = liveN;
    document.getElementById('updated').textContent = 'อัปเดต ' + (DATA.last_ts?fmtTs(DATA.last_ts):'-');

    render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--red)">โหลดข้อมูลไม่สำเร็จ: '+e+'</div>';
  }
}

load();
setInterval(load, 300000);
</script>
