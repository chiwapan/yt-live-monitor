<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Live Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #101418;
  --muted: #6b7280;
  --line: #e4e6ea;
  --red: #dc2626;
  --green: #16a34a;
  --blue: #1d4ed8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans Thai', sans-serif;
  background: var(--bg);
  background-image: radial-gradient(#d8dbe1 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  min-height: 100vh;
}
.num { font-family: 'Space Grotesk','Noto Sans Thai',sans-serif; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
}
.brand { display:flex; align-items:center; gap:12px; }
.brand .pulse {
  width: 14px; height: 14px; border-radius: 50%; background: var(--red);
  box-shadow: 0 0 0 0 rgba(220,38,38,.5); animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(220,38,38,.45); }
  70% { box-shadow: 0 0 0 12px rgba(220,38,38,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
}
.brand h1 {
  font-family: 'Space Grotesk','Noto Sans Thai',sans-serif;
  font-size: 26px; font-weight: 700; letter-spacing: -.5px;
}
.brand h1 span { color: var(--red); }
.topmeta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.livenow {
  display:inline-flex; align-items:center; gap:6px;
  background: #fef2f2; border:1px solid #fecaca; color: var(--red);
  font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
}
.livenow .d { width:7px; height:7px; border-radius:50%; background:var(--red); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity:.25; } }
select#dateSel {
  font-family: 'Space Grotesk','Noto Sans Thai',sans-serif;
  font-size: 14px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
}
select#dateSel:hover { border-color: #b9bec7; }
.updated { font-size: 12px; color: var(--muted); }

/* ── Tabs ── */
.tabs { display:flex; gap:4px; border-bottom: 2px solid var(--line); margin-bottom: 24px; flex-wrap:wrap; }
.tabs button {
  font-family: 'Noto Sans Thai',sans-serif; font-size: 14px; font-weight: 500;
  background: none; border: none; padding: 10px 16px; cursor: pointer;
  color: var(--muted); position: relative; transition: color .15s;
}
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--ink); font-weight: 600; }
.tabs button.active::after {
  content:''; position:absolute; left:8px; right:8px; bottom:-2px; height:3px;
  background: var(--red); border-radius: 2px 2px 0 0;
}
.tabs button .cnt {
  font-family:'Space Grotesk',sans-serif; font-size:11px; background:#eef0f3;
  color:var(--muted); border-radius:10px; padding:1px 7px; margin-left:6px;
}
.tabs button.active .cnt { background:#fef2f2; color:var(--red); }

/* ── Stat strip ── */
.strip { display:grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:26px; }
.stat {
  background: var(--card); border:1px solid var(--line); border-radius:10px;
  padding: 16px 18px; transition: transform .15s, box-shadow .15s;
}
.stat:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(16,20,24,.07); }
.stat .lbl { font-size:11px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.stat .val { font-family:'Space Grotesk','Noto Sans Thai',sans-serif; font-size:30px; font-weight:700; letter-spacing:-1px; line-height:1; }
.stat .sub { font-size:12px; color:var(--muted); margin-top:6px; }
.stat.red .val { color: var(--red); }
.stat.blue .val { color: var(--blue); }

/* ── Cards / charts ── */
.panel {
  background: var(--card); border:1px solid var(--line); border-radius:12px;
  padding: 20px; margin-bottom: 22px;
}
.panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.panel-head h2 { font-size:16px; font-weight:600; display:flex; align-items:center; gap:10px; }
.panel-head .hint { font-size:12px; color:var(--muted); }
.chip { font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; }
.chip.live { background:#dcfce7; color:var(--green); }
.chip.off { background:#f1f2f4; color:var(--muted); }
.chartbox { position:relative; height:380px; }
.chartbox.tall { height:440px; }
.chartbox.fullpage { height: 360px; min-height: 300px; }
.compare-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 18px; }
.compare-toolbar .range-label { font-size:13px; color:var(--muted); }
.range-buttons { display:flex; gap:6px; }
.range-buttons button { font-family:'Noto Sans Thai',sans-serif; font-size:12px; border:1px solid var(--line); background:#fff; color:var(--muted); padding:6px 11px; border-radius:7px; cursor:pointer; }
.range-buttons button:hover { border-color:#aeb5c0; color:var(--ink); }
.range-buttons button.active { background:var(--ink); border-color:var(--ink); color:#fff; }
.compare-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-bottom:18px; }
.compare-summary .stat { padding:12px 14px; }
.compare-summary .stat .val { font-size:22px; }
.compare-summary .stat .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.compare-table th.program-head { white-space:normal; min-width:180px; }
.compare-table th.program-head small { display:block; margin-top:3px; font-size:10px; font-weight:400; color:var(--muted); text-transform:none; letter-spacing:0; }
.compare-table td { min-width:150px; }
.compare-panels { display:grid; gap:18px; }
@media (max-width: 720px) {
  .compare-toolbar { align-items:flex-start; }
  .range-buttons { width:100%; }
  .range-buttons button { flex:1; }
  .compare-summary { grid-template-columns:repeat(2,1fr); }
  .compare-summary .stat .val { font-size:18px; }
  .panel { padding:14px; }
  .panel-head .hint { width:100%; font-size:11px; line-height:1.5; }
  .chartbox.fullpage { height:250px; min-height:0; }
  .compare-table td { min-width:0; }
  .compare-table td::before { content:attr(data-label); text-transform:none; font-size:11px; }
  .compare-table td.date-cell { display:block; padding-bottom:9px; color:var(--ink); }
  .compare-table td.date-cell::before { display:none; }
  .compare-table td[data-label]:not(.date-cell) { align-items:center; }
  .compare-table .peakcell { font-size:16px; }
  .compare-table .delta { margin-left:auto !important; }
  .compare-table .airtime { margin-left:auto; }
}
.chartbox.mini { height:170px; }
body.chview .wrap { max-width: 100%; padding-left: 28px; padding-right: 28px; }

/* ── Channel cards grid (overview) ── */
.chgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-bottom:26px; }
.chcard {
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;
  cursor:pointer; transition: transform .15s, box-shadow .15s, border-color .15s;
  border-top: 4px solid var(--chcolor,#999);
}
.chcard:hover { transform:translateY(-3px); box-shadow:0 10px 24px rgba(16,20,24,.09); }
.chcard .name { font-size:16px; font-weight:700; margin-bottom:2px; display:flex; align-items:center; gap:8px; }
.chcard .peak { font-family:'Space Grotesk',sans-serif; font-size:38px; font-weight:700; letter-spacing:-1.5px; margin:10px 0 2px; color:var(--chcolor); }
.chcard .peaklbl { font-size:11px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
.chcard .row { display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-top:1px solid #f0f1f3; margin-top:10px; }
.chcard .row .k { color:var(--muted); }
.chcard .row .v { font-weight:600; }
.chcard .go { font-size:12px; color:var(--blue); font-weight:600; margin-top:12px; }

/* ── Table ── */
table { width:100%; border-collapse:collapse; }
th { text-align:left; font-size:11px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; color:var(--muted); padding:10px 14px; border-bottom:2px solid var(--line); white-space:nowrap; }
td { padding:12px 14px; font-size:13.5px; border-bottom:1px solid #f0f1f3; vertical-align:middle; }
tbody tr { transition: background .12s; }
tbody tr:hover { background:#fafbfc; }
td.t-title { max-width:420px; }
a.tlink { color:var(--ink); text-decoration:none; font-weight:500; }
a.tlink:hover { color:var(--blue); text-decoration:underline; }
.badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; letter-spacing:.3px; }
.badge.live { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
.badge.ended { background:#f1f2f4; color:var(--muted); }
td.peakcell { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }

/* ── Mobile ── */
@media (max-width: 720px) {
  .wrap { padding: 14px 12px 40px; }
  .brand h1 { font-size: 20px; }
  .topbar { gap: 10px; }
  .strip { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .stat { padding: 12px 14px; }
  .stat .val { font-size: 22px; }
  .chartbox { height: 260px; }
  .chartbox.fullpage { height: 55vh; min-height: 300px; }
  .chartbox.mini { height: 150px; }
  .minigrid { grid-template-columns: 1fr; }
  .tabs button { font-size: 13px; padding: 8px 10px; }
  .sechead { font-size: 16px; margin: 22px 0 10px; }

  /* Table → card list */
  .tablepanel { padding: 0; overflow: hidden; }
  .tablepanel table, .tablepanel tbody, .tablepanel tr, .tablepanel td { display: block; width: 100%; }
  .tablepanel thead { display: none; }
  .tablepanel tr {
    padding: 14px 16px; border-bottom: 1px solid #f0f1f3;
  }
  .tablepanel tr:hover { background: #fafbfc; }
  .tablepanel td {
    border: none; padding: 3px 0; font-size: 13px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  .tablepanel td::before {
    content: attr(data-label);
    font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted); flex-shrink: 0;
  }
  .tablepanel td.t-title { display: block; padding-bottom: 8px; }
  .tablepanel td.t-title::before { display: none; }
  .tablepanel td.t-title a { font-size: 14px; line-height: 1.5; }
  .tablepanel td.peakcell { font-size: 16px; }
}

/* ── Per-stream mini chart grid ── */
.minigrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
.minicard { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; transition: box-shadow .15s, transform .15s; }
.minicard:hover { box-shadow:0 8px 20px rgba(16,20,24,.08); transform:translateY(-2px); }
.minicard .mtitle { font-size:13px; font-weight:600; line-height:1.45; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.minicard .mmeta { font-size:11.5px; color:var(--muted); margin-bottom:10px; }
.minicard .mmeta b { color:var(--ink); font-family:'Space Grotesk',sans-serif; }

.sechead { font-size:18px; font-weight:700; margin:30px 0 14px; display:flex; align-items:center; gap:10px; }
.sechead::before { content:''; width:5px; height:20px; background:var(--red); border-radius:3px; }
.backlink { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--blue); text-decoration:none; margin-bottom:16px; }
.backlink:hover { text-decoration:underline; }
.empty { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
.footer { text-align:center; font-size:11.5px; color:#9aa0aa; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <span class="pulse"></span>
      <h1>YT LIVE <span>MONITOR</span></h1>
    </div>
    <div class="topmeta">
      <span class="livenow" id="liveBadge"><span class="d"></span><span id="liveCount">-</span> LIVE</span>
      <select id="dateSel" onchange="onDateChange()"><option value="">กำลังโหลด...</option></select>
      <span class="updated num" id="updated"></span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="empty">กำลังโหลดข้อมูล...</div></div>
  <div class="footer">ข้อมูลจาก YouTube Data API · สำรวจทุก 5 นาที · เวลาไทย (ICT)</div>
</div>

<script>
const CH_COLORS = {
  'ThaiRath News':    '#dc2626',
  'ThaiRath Variety': '#1d4ed8',
  'ข่าวช่อง8':        '#ea580c',
  'Amarin TV':        '#0d9488',
};
const CH_ORDER = ['ThaiRath News','ThaiRath Variety','ข่าวช่อง8','Amarin TV'];

let DATA = null;
let SLOTCMP = null;        // /api/slot-compare data (compare view)
let VIEW = 'overview';      // 'overview' | 'compare' | channel name
let DATE = null;            // null = ยังไม่เลือก (ใช้วันที่ล่าสุด), '' = ทั้งหมด, 'YYYY-MM-DD' = วันนั้น
let charts = [];
let COMPARE_RANGE = 14;       // จำนวนวันที่แสดงในหน้าเปรียบเทียบ; 0 = ทั้งหมด

function fmt(n){ return (n||0).toLocaleString('th-TH'); }
function chColor(ch){ return CH_COLORS[ch] || '#64748b'; }

function toICT(ts){
  if(!ts) return null;
  if(ts.endsWith('Z')) return new Date(ts).getTime();
  // Normalize "YYYY-MM-DD H:M:S" (อาจไม่ zero-pad จาก Sheets backfill)
  const m = ts.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{1,2}):(\d{1,2})$/);
  if(m){
    const [,y,mo,d,h,mi,s] = m;
    return new Date(`${y}-${mo}-${d}T${h.padStart(2,'0')}:${mi.padStart(2,'0')}:${s.padStart(2,'0')}+07:00`).getTime();
  }
  return new Date(ts.replace(' ','T')+'+07:00').getTime();
}
function fmtTime(ms){
  return new Date(ms).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Bangkok'});
}
function fmtDayTime(ms){
  const d=new Date(ms);
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',timeZone:'Asia/Bangkok'})+' '+fmtTime(ms);
}
function fmtStart(iso){
  const ms = toICT(iso);
  return ms ? fmtDayTime(ms) : '-';
}
function fmtTs(ts){ const ms=toICT(ts); return ms?fmtDayTime(ms):'-'; }
function fmtTsTime(ts){ const ms=toICT(ts); return ms?fmtTime(ms):'-'; }
function shortTitle(t,n=48){ return t.length>n ? t.slice(0,n)+'…' : t; }

function destroyCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }

/* ── Navigation ── */
function renderTabs(){
  const el = document.getElementById('tabs');
  const chs = Object.keys(DATA.channels).sort((a,b)=>CH_ORDER.indexOf(a)-CH_ORDER.indexOf(b));
  let h = `<button class="${VIEW==='overview'?'active':''}" onclick="go('overview')">ภาพรวม</button>`;
  h += `<button class="${VIEW==='compare'?'active':''}" onclick="go('compare')">เปรียบเทียบ Live รายการข่าว</button>`;
  for(const ch of chs){
    const n = DATA.channels[ch].streams.length;
    h += `<button class="${VIEW===ch?'active':''}" onclick="go('${ch.replace(/'/g,"\\'")}')">${ch}<span class="cnt num">${n}</span></button>`;
  }
  el.innerHTML = h;
}
function go(view){
  const switching = (view==='compare') !== (VIEW==='compare');
  VIEW=view;
  if(switching) load(); else render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function onDateChange(){ DATE = document.getElementById('dateSel').value || ''; load(); }

/* ── Overview ── */
function renderOverview(){
  const chs = Object.keys(DATA.channels).sort((a,b)=>CH_ORDER.indexOf(a)-CH_ORDER.indexOf(b));
  const allStreams = chs.flatMap(ch=>DATA.channels[ch].streams);
  // Peak สูงสุดของวัน + รายการที่ทำได้
  let topStream = null, topCh = '';
  for(const ch of chs) for(const s of DATA.channels[ch].streams){
    if(!topStream || s.peak > topStream.peak){ topStream = s; topCh = ch; }
  }
  const dateLbl = DATE || 'ทั้งหมด';

  let h = `<div class="strip">
    <div class="stat blue"><div class="lbl">Peak สูงสุด (${dateLbl})</div><div class="val num">${topStream?fmt(topStream.peak):'-'}</div><div class="sub">${topStream?shortTitle(topStream.title,40)+' · '+topCh:'-'}</div></div>
    <div class="stat"><div class="lbl">จำนวนรายการ</div><div class="val num">${allStreams.length}</div><div class="sub">${dateLbl}</div></div>
  </div>`;

  // Channel cards
  h += `<div class="chgrid">`;
  for(const ch of chs){
    const info = DATA.channels[ch];
    const liveN = info.streams.filter(s=>s.is_live).length;
    h += `<div class="chcard" style="--chcolor:${chColor(ch)}" onclick="go('${ch.replace(/'/g,"\\'")}')">
      <div class="name">${ch} ${liveN?`<span class="chip live num">${liveN} LIVE</span>`:`<span class="chip off">OFF AIR</span>`}</div>
      <div class="peak num">${fmt(info.peak)}</div>
      <div class="peaklbl">Peak Viewers</div>
      <div class="row"><span class="k">จำนวนรายการ</span><span class="v num">${info.streams.length}</span></div>
      <div class="go">ดูรายละเอียด →</div>
    </div>`;
  }
  h += `</div>`;

  // ── Program Ranking (cross-channel, sorted by peak) ──
  const ranked = chs.flatMap(ch=>DATA.channels[ch].streams.map(s=>({...s, ch})));
  ranked.sort((a,b)=>b.peak-a.peak);
  h += `<div class="sechead">Program Ranking — Peak Viewers</div>
  <div class="panel tablepanel">
  <table><thead><tr>
    <th>#</th><th>รายการ</th><th>ช่อง</th><th>Peak</th><th>Peak เมื่อ</th><th>ช่วงเวลา</th>
  </tr></thead><tbody>`;
  ranked.forEach((s,i)=>{
    const startMs = toICT(s.actual_start||s.start_ts);
    const endMs = toICT(s.end_ts||s.peak_ts);
    const timeRange = startMs&&endMs ? fmtTime(startMs)+'–'+fmtTime(endMs) : '-';
    h += `<tr>
      <td class="num" data-label="#" style="font-weight:700;color:${i<3?'var(--red)':'var(--muted)'}">${i+1}</td>
      <td class="t-title" data-label="รายการ"><a class="tlink" href="${s.url}" target="_blank">${shortTitle(s.title,55)}</a></td>
      <td data-label="ช่อง"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${chColor(s.ch)};display:inline-block;"></span>${s.ch}</span></td>
      <td class="peakcell" data-label="Peak" style="color:${chColor(s.ch)}">${fmt(s.peak)}</td>
      <td class="num" data-label="Peak เมื่อ" style="white-space:nowrap;color:var(--muted)">${fmtTsTime(s.peak_ts)}</td>
      <td class="num" data-label="ช่วงเวลา" style="white-space:nowrap">${timeRange}</td>
    </tr>`;
  });
  h += `</tbody></table></div>`;

  // Combined concurrent chart (sum per channel)
  h += `<div class="panel">
    <div class="panel-head"><h2>Concurrent Viewers รวมทุกช่อง</h2><span class="hint">ข้อมูลวันที่ ${DATE||'ทั้งหมด'}</span></div>
    <div class="chartbox fullpage"><canvas id="comboChart"></canvas></div>
  </div>`;

  document.getElementById('content').innerHTML = h;
  drawComboChart(chs);
}

function drawComboChart(chs){
  // ts → {ch: sum}
  const byTs = {};
  for(const ch of chs){
    for(const s of DATA.channels[ch].streams){
      for(const p of s.points){
        if(!byTs[p.ts]) byTs[p.ts]={};
        byTs[p.ts][ch]=(byTs[p.ts][ch]||0)+p.viewers;
      }
    }
  }
  const tsAll = Object.keys(byTs).sort((a,b)=>toICT(a)-toICT(b));
  const labels = tsAll.map(ts=>toICT(ts));
  const datasets = chs.map(ch=>({
    label: ch,
    data: tsAll.map(ts=>({x:toICT(ts), y:byTs[ts][ch]||0})),
    borderColor: chColor(ch),
    backgroundColor: chColor(ch)+'18',
    borderWidth: 2, pointRadius: 0, tension:.3, fill:true,
  }));
  charts.push(new Chart(document.getElementById('comboChart'),{
    type:'line',
    data:{datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      parsing:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',font:{family:'Noto Sans Thai',size:12}}},
        tooltip:{callbacks:{
          title:items=>fmtDayTime(items[0].parsed.x),
          label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`}} },
      scales:{
        x:{type:'linear',bounds:'data',ticks:{maxTicksLimit:14,callback(v){return DATE?fmtTime(v):fmtDayTime(v);}}},
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}
      }
    }
  }));
}

/* ── Channel page ── */
function renderChannel(ch){
  const info = DATA.channels[ch];
  const color = chColor(ch);
  const liveN = info.streams.filter(s=>s.is_live).length;
  // LIVE ก่อน (เรียงตาม peak) → จบแล้วเรียงใหม่→เก่า
  const sorted = [...info.streams].sort((a,b)=>{
    if(a.is_live !== b.is_live) return a.is_live ? -1 : 1;
    if(a.is_live) return b.peak - a.peak;
    return toICT(b.end_ts||b.peak_ts||b.start_ts) - toICT(a.end_ts||a.peak_ts||a.start_ts);
  });

  let h = `<a href="#" class="backlink" onclick="go('overview');return false;">← กลับภาพรวม</a>`;
  h += `<div class="strip">
    <div class="stat" style="border-top:4px solid ${color}"><div class="lbl">${ch}</div><div class="val num" style="color:${color}">${fmt(info.peak)}</div><div class="sub">Peak Viewers</div></div>
    <div class="stat red"><div class="lbl">กำลัง Live</div><div class="val num">${liveN}</div><div class="sub">${liveN?'ออกอากาศอยู่':'ไม่มีรายการ live'}</div></div>
    <div class="stat"><div class="lbl">ผู้ชมตอนนี้</div><div class="val num">${info.current?fmt(info.current):'-'}</div><div class="sub">concurrent viewers</div></div>
    <div class="stat"><div class="lbl">จำนวนรายการ</div><div class="val num">${info.streams.length}</div><div class="sub">${DATE?'วันที่ '+DATE:'ทั้งหมด'}</div></div>
  </div>`;

  // Full-day chart — no legend (table + mini charts below cover it)
  h += `<div class="panel">
    <div class="panel-head">
      <h2><span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span> Concurrent Viewers ทั้งวัน — ${ch}</h2>
      <span class="hint">เส้นทึบ = LIVE · เส้นประ = จบแล้ว · hover ดูค่า</span>
    </div>
    <div class="chartbox fullpage"><canvas id="dayChart"></canvas></div>
  </div>`;

  // Table
  h += `<div class="sechead">รายการ</div>
  <div class="panel tablepanel">
  <table><thead><tr>
    <th>รายการ</th><th>เริ่ม</th><th>จบ / ล่าสุด</th><th>สถานะ</th><th>Peak</th><th>Peak เมื่อ</th><th>ตอนนี้</th>
  </tr></thead><tbody>`;
  for(const s of sorted){
    const startMs = s.actual_start ? toICT(s.actual_start) : toICT(s.start_ts);
    h += `<tr>
      <td class="t-title" data-label="รายการ"><a class="tlink" href="${s.url}" target="_blank">${s.title}</a></td>
      <td class="num" data-label="เริ่ม" style="white-space:nowrap">${fmtStart(s.actual_start||s.start_ts)}</td>
      <td class="num" data-label="จบ / ล่าสุด" style="white-space:nowrap">${s.is_live?'<span style="color:var(--red);font-weight:600;">กำลัง Live</span>':fmtTs(s.end_ts)}</td>
      <td data-label="สถานะ"><span class="badge ${s.is_live?'live':'ended'}">${s.is_live?'LIVE':'จบแล้ว'}</span></td>
      <td class="peakcell" data-label="Peak" style="color:${color}">${fmt(s.peak)}</td>
      <td class="num" data-label="Peak เมื่อ" style="white-space:nowrap;color:var(--muted)">${fmtTsTime(s.peak_ts)}</td>
      <td class="num" data-label="ตอนนี้" style="font-weight:600">${s.is_live?fmt(s.points[s.points.length-1].viewers):'-'}</td>
    </tr>`;
  }
  h += `</tbody></table></div>`;

  // Per-stream mini charts
  h += `<div class="sechead">กราฟแยกรายการ</div><div class="minigrid">`;
  sorted.slice(0,12).forEach((s,i)=>{
    h += `<div class="minicard">
      <div class="mtitle"><a class="tlink" href="${s.url}" target="_blank">${s.title}</a></div>
      <div class="mmeta">เริ่ม ${fmtStart(s.actual_start||s.start_ts)} · Peak <b>${fmt(s.peak)}</b> คน ${s.is_live?'· <span style="color:var(--red);font-weight:600;">LIVE</span>':''}</div>
      <div class="chartbox mini"><canvas id="mini${i}"></canvas></div>
    </div>`;
  });
  h += `</div>`;

  document.getElementById('content').innerHTML = h;

  // Day chart
  const dayDatasets = sorted.filter(s=>s.points.length>1).map(s=>({
    label: shortTitle(s.title,42),
    data: s.points.map(p=>({x:toICT(p.ts), y:p.viewers})),
    borderColor: s.is_live ? color : '#9aa0aa',
    borderDash: s.is_live ? [] : [6,4],
    borderWidth: s.is_live ? 2.5 : 1.5,
    backgroundColor: s.is_live ? color+'15' : 'transparent',
    pointRadius: 0, tension:.3, fill: s.is_live,
  }));
  charts.push(new Chart(document.getElementById('dayChart'),{
    type:'line',
    data:{datasets:dayDatasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      parsing:false, interaction:{mode:'nearest',axis:'x',intersect:false},
      plugins:{ legend:{display:false},
        tooltip:{
          itemSort:(a,b)=>b.parsed.y-a.parsed.y,
          callbacks:{
            title:items=>fmtDayTime(items[0].parsed.x),
            label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`
          }
        } },
      scales:{
        x:{type:'linear',bounds:'data',ticks:{maxTicksLimit:16,callback(v){return DATE?fmtTime(v):fmtDayTime(v);}}},
        y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}
      }
    }
  }));

  // Mini charts
  sorted.slice(0,12).forEach((s,i)=>{
    charts.push(new Chart(document.getElementById('mini'+i),{
      type:'line',
      data:{datasets:[{
        data: s.points.map(p=>({x:toICT(p.ts), y:p.viewers})),
        borderColor: s.is_live?color:'#9aa0aa',
        borderDash: s.is_live?[]:[5,4],
        borderWidth:2, pointRadius:0, tension:.3,
        backgroundColor:(s.is_live?color:'#9aa0aa')+'14', fill:true,
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        parsing:false, plugins:{legend:{display:false},
          tooltip:{callbacks:{label:c=>` ${fmt(c.parsed.y)} คน · ${fmtTime(c.parsed.x)}`}}},
        scales:{
          x:{type:'linear',bounds:'data',display:true,ticks:{maxTicksLimit:6,callback:v=>fmtTime(v)},grid:{display:false}},
          y:{beginAtZero:true,ticks:{maxTicksLimit:4,callback:v=>fmt(v)},grid:{color:'#f0f1f3'}}
        }
      }
    }));
  });
}

/* ── Slot comparison (เช้า/เที่ยง/เย็น/Primetime วันต่อวัน) ── */
function slotDateLabel(d){
  const dt = new Date(d+'T00:00:00+07:00');
  return dt.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Bangkok'});
}
function diffHtml(cur, prev){
  if(prev==null || prev===0 || cur==null) return '<span style="color:var(--muted)">-</span>';
  const pct = (cur-prev)/prev*100;
  const cls = pct>=0 ? 'color:var(--green)' : 'color:var(--red)';
  return `<span style="${cls};font-weight:600">${pct>=0?'+':''}${pct.toFixed(0)}%</span>`;
}
function setCompareRange(range){
  COMPARE_RANGE = range;
  render();
}
async function renderCompare(){
  if(!SLOTCMP){
    try{
      const r = await fetch('/api/slot-compare');
      SLOTCMP = await r.json();
    }catch(e){
      document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--red)">โหลดข้อมูลเปรียบเทียบไม่สำเร็จ</div>';
      return;
    }
  }
  const slots = SLOTCMP.slots||[];
  let h = `<div class="sechead" style="margin-top:0">เปรียบเทียบ Live รายการข่าว</div>
    <div class="compare-toolbar">
      <span class="range-label">Peak viewers รายวัน · เลือกช่วงข้อมูลที่ต้องการดู</span>
      <div class="range-buttons">
        <button class="${COMPARE_RANGE===7?'active':''}" onclick="setCompareRange(7)">7 วัน</button>
        <button class="${COMPARE_RANGE===14?'active':''}" onclick="setCompareRange(14)">14 วัน</button>
        <button class="${COMPARE_RANGE===30?'active':''}" onclick="setCompareRange(30)">30 วัน</button>
        <button class="${COMPARE_RANGE===0?'active':''}" onclick="setCompareRange(0)">ทั้งหมด</button>
      </div>
    </div>`;
  if(!slots.length){
    h += '<div class="empty">ยังไม่มีข้อมูล</div>';
    document.getElementById('content').innerHTML = h;
    return;
  }

  // Summary: แสดงผลล่าสุดของแต่ละช่วงก่อน ให้ผู้ใช้เห็นคำตอบทันที
  h += `<div class="compare-summary">`;
  slots.forEach(slot=>{
    const allDates = new Set();
    slot.programs.forEach(p=>Object.keys(p.days).forEach(d=>allDates.add(d)));
    const latest = [...allDates].sort().reverse()[0];
    const rows = latest ? slot.programs.map(p=>({name:p.name, peak:p.days[latest]?.peak||0})).filter(x=>x.peak>0).sort((a,b)=>b.peak-a.peak) : [];
    const winner = rows[0];
    h += `<div class="stat blue">
      <div class="lbl">${slot.name} · ล่าสุด</div>
      <div class="val num">${winner?fmt(winner.peak):'-'}</div>
      <div class="sub">${winner?winner.name:'ยังไม่มีข้อมูล'}${latest?' · '+slotDateLabel(latest):''}</div>
    </div>`;
  });
  h += `</div><div class="compare-panels">`;

  slots.forEach((slot,si)=>{
    const allDates = new Set();
    slot.programs.forEach(p=>Object.keys(p.days).forEach(d=>allDates.add(d)));
    const descDates = [...allDates].sort().reverse();
    const dates = COMPARE_RANGE ? descDates.slice(0,COMPARE_RANGE) : descDates;
    const chartDates = [...dates].sort();
    h += `<div class="panel">
      <div class="panel-head"><h2>${slot.name}</h2><span class="hint">Peak viewers · Δ% เทียบวันก่อนหน้า · เวลาออกอากาศ</span></div>
      <div class="chartbox fullpage"><canvas id="slotChart${si}"></canvas></div>
      <div class="tablepanel compare-table" style="margin-top:16px;overflow-x:auto">
      <table><thead><tr><th>วันที่</th>`;
    slot.programs.forEach(p=>{
      h += `<th class="program-head" style="text-align:right"><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${chColor(p.channel)};display:inline-block"></span>${p.name}</span><small>${p.channel}</small></th>`;
    });
    h += `</tr></thead><tbody>`;
    dates.forEach(date=>{
      h += `<tr><td class="num date-cell" data-label="วันที่" style="white-space:nowrap;font-weight:600">${slotDateLabel(date)}</td>`;
      slot.programs.forEach(p=>{
        const e = p.days[date];
        const prev = p.days[prevDateOf(descDates,date)];
        if(!e){
          h += `<td class="num" data-label="${p.name}" style="text-align:right;color:var(--muted)">—</td>`;
        }else{
          h += `<td class="num" data-label="${p.name}" style="text-align:right">
            <span class="peakcell">${fmt(e.peak)}</span>
            <span class="delta" style="font-size:11.5px;margin-left:6px">${diffHtml(e.peak, prev?prev.peak:null)}</span>
            <div class="airtime" style="font-size:11px;color:var(--muted)">${e.start}–${e.end}</div>
          </td>`;
        }
      });
      h += `</tr>`;
    });
    h += `</tbody></table></div></div>`;

    // Store filtered dates for chart creation below.
    slot._compareDates = chartDates;
  });
  h += `</div>`;
  document.getElementById('content').innerHTML = h;

  slots.forEach((slot,si)=>{
    const dates = slot._compareDates || [];
    charts.push(new Chart(document.getElementById('slotChart'+si),{
      type:'line',
      data:{labels:dates.map(slotDateLabel),datasets:slot.programs.map(p=>({
        label:p.name,
        data:dates.map(d=>p.days[d]?p.days[d].peak:null),
        borderColor:chColor(p.channel), backgroundColor:chColor(p.channel),
        borderWidth:2.5, tension:.3, spanGaps:true, pointRadius:3, pointHoverRadius:5
      }))},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',font:{family:'Noto Sans Thai',size:12}}},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmt(c.parsed.y)} คน`}}},
        scales:{x:{ticks:{maxTicksLimit:7}},y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},grid:{color:'#eef0f3'}}}
      }
    }));
    delete slot._compareDates;
  });
}
function prevDateOf(sortedDescDates, date){
  const i = sortedDescDates.indexOf(date);
  return sortedDescDates[i+1];  // sortedDescDates เรียงล่าสุดก่อน → index+1 = วันก่อนหน้า
}

/* ── Render / load ── */
function render(){
  destroyCharts();
  renderTabs();
  document.body.classList.toggle('chview', VIEW!=='overview' && !!(DATA&&DATA.channels[VIEW]));
  if(!DATA || !Object.keys(DATA.channels).length){
    document.getElementById('content').innerHTML = '<div class="empty">ยังไม่มีข้อมูลในวันที่เลือก</div>';
    return;
  }
  if(VIEW==='overview') renderOverview();
  else if(VIEW==='compare') renderCompare();
  else if(DATA.channels[VIEW]) renderChannel(VIEW);
  else renderOverview();
}

async function load(){
  try{
    if(DATE === null){
      // โหลดครั้งแรก: หาวันที่ล่าสุด แล้วดึงเฉพาะวันนั้น (ดูวันต่อวัน)
      const r0 = await fetch('/api/live-data');
      const d0 = await r0.json();
      DATE = (d0.dates||[])[0] || '';
    }
    if(VIEW==='compare') SLOTCMP = null;  // refresh ข้อมูลเปรียบเทียบทุกรอบ
    const url = '/api/live-data' + (DATE?('?date='+DATE):'');
    const r = await fetch(url);
    DATA = await r.json();

    // date selector
    const sel = document.getElementById('dateSel');
    sel.innerHTML = '<option value="">ทั้งหมด</option>' +
      (DATA.dates||[]).map(d=>`<option value="${d}" ${d===DATE?'selected':''}>${d}</option>`).join('');

    // live badge + updated
    const liveN = Object.values(DATA.channels).reduce((s,c)=>s+c.streams.filter(x=>x.is_live).length,0);
    document.getElementById('liveCount').textContent = liveN;
    document.getElementById('updated').textContent = 'อัปเดต ' + (DATA.last_ts?fmtTs(DATA.last_ts):'-');

    render();
  }catch(e){
    document.getElementById('content').innerHTML = '<div class="empty" style="color:var(--red)">โหลดข้อมูลไม่สำเร็จ: '+e+'</div>';
  }
}

load();
setInterval(load, 300000);
</script>
