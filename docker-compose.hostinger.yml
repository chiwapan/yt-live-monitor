# yt-live-monitor — แยกจาก Hermes อย่างสมบูรณ์
# UI-friendly: ใช้ absolute path ชี้ไปที่ repo บน HOST จริง
# (บน host: /docker/hermes-agent-r6gh/data = bind mount ของ /opt/data ใน Hermes sandbox)
# .env อยู่ที่ <repo>/.env

services:
  web:
    build:
      context: /docker/hermes-agent-r6gh/data/projects/yt-live-monitor
      dockerfile: Dockerfile
    container_name: yt-live-monitor-web
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      - PORT=8899
      - LIVE_JSONL=/data/live_data.jsonl
      - VIEWS_JSONL=/data/views_data.jsonl
      - VIEWS_LIVE_JSONL=/data/views_live.jsonl
    volumes:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/live_data.jsonl:/data/live_data.jsonl
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/views_data.jsonl:/data/views_data.jsonl
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/views_live.jsonl:/data/views_live.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8899/api/ping',timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 3

  collector:
    build:
      context: /docker/hermes-agent-r6gh/data/projects/yt-live-monitor
      dockerfile: Dockerfile.collector
    container_name: yt-live-monitor-collector
    restart: unless-stopped
    env_file:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/.env
    environment:
      - TZ=Asia/Bangkok
      - LIVE_JSONL=/data/live_data.jsonl
      - STATE_FILE=/data/yt-live-daily-state.json
      - GAPI_SCRIPT=/app/google_api.py
      - YT_SHEET_ID=   # Sheets ไม่ใช้แล้ว — JSONL เป็น database หลัก
    volumes:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/live_data.jsonl:/data/live_data.jsonl
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/yt-live-daily-state.json:/data/yt-live-daily-state.json
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; s=os.path.getmtime('/data/live_data.jsonl'); print('stale' if time.time()-s>420 else 'ok'); raise SystemExit(1 if time.time()-s>420 else 0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Views collector: batch รายวัน (Analytics API, OAuth) แยกจาก live monitor ──
  views-collector:
    build:
      context: /docker/hermes-agent-r6gh/data/projects/yt-live-monitor
      dockerfile: Dockerfile.views
    container_name: yt-views-collector
    restart: unless-stopped
    env_file:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/.env
    environment:
      - TZ=Asia/Bangkok
      - MODE=snapshot
      - VIEWS_JSONL=/data/views_data.jsonl
      - VIEWS_LIVE_JSONL=/data/views_live.jsonl
      - GAPI_SCRIPT=/app/google_api.py
      - HERMES_HOME=/token
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SNAPSHOT_TOP=15
    volumes:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/views_data.jsonl:/data/views_data.jsonl
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/views_live.jsonl:/data/views_live.jsonl
      - /docker/hermes-agent-r6gh/data/google_token.json:/token/google_token.json
      - /docker/hermes-agent-r6gh/data/google_client_secret.json:/token/google_client_secret.json
    command: >
      sh -c "while true; do python yt-views-collector.py;
      echo '[views] sleeping 1h'; sleep 3600; done"

  # Cloudflare tunnel — serve live.chiwapan.online -> localhost:8899
  # network_mode: host เห็น localhost:8899 ที่ web publish (เหมือน config เดิมใน Hermes)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: yt-live-monitor-tunnel
    restart: unless-stopped
    network_mode: host
    env_file:
      - /docker/hermes-agent-r6gh/data/projects/yt-live-monitor/.env
    command: tunnel run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - web